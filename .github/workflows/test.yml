name: Test and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Self-hosted only (no GitHub-hosted runners). The build runner has no Python
    # toolcache, so the toolchain runs in a container as the runner user (no
    # root-owned files left in the workspace).
    runs-on: [self-hosted, build-runner, docker-build]
    # warden is public: never run code from a fork's pull request on the LAN
    # build runner. Pushes and PRs from branches in this repo still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint and test (python:3.12-slim)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            python:3.12-slim \
            sh -euc '
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --quiet --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
              /tmp/venv/bin/ruff check .
              /tmp/venv/bin/python -m pytest -v
            '
