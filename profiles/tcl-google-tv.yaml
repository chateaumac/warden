# TCL Google TV sets (QM6K/QM7/QM8 and others on the G08/G10 boards, Android 14)
#
# Package knowledge comes from cleanyourtv's examples/tcl-qm6k-google-tv list and its
# TCL 75QM751G (QM7) device notes (github.com/Gathin23/cleanyourtv), applied on the
# same G08 board / AU14 firmware.
#
# NEVER add these, whatever a guide says (they run the TV or its inputs):
#   com.tcl.tv, com.tcl.tvinput, com.tcl.dashboard, com.tcl.suspension, com.tcl.autopair,
#   com.tcl.systemserver, com.tcl.globalkeyoverlay, com.tcl.systemui.plugin, com.mediatek.*
# and especially com.tcl.providers.config, com.tcl.initsetup, com.tcl.factory.view —
# together they dropped Wi-Fi on an AU14 set and it took a re-pair to get back in.
#
# Not disabled on purpose: com.google.android.apps.tv.launcherx (stock home) and
# com.google.android.tungsten.setupwraith. Without launcherx the remote's YouTube and gear
# keys go dead and setupwraith's blank RecoveryActivity takes Home; disabling setupwraith
# deletes the Wi-Fi network it saved during setup and breaks phone casting.
id: tcl-google-tv
name: TCL Google TV
connector: adb
default_port: 5555
description: >
  TCL televisions running Google TV. Everything in the Google TV profile (Privacy
  Sandbox ad stack, telemetry, feedback) plus TCL's own layer: Samba TV ACR and
  TCL analytics (com.tcl.ttvs), log upload, home-screen content pushes, promo
  messages and the silent partner-app installers.
match:
  keywords: ["tcl", "smart tv pro", "g08", "g10", "tcl9618", "qm7", "qm6k", "qm8"]
  mdns_types: ["_googlecast._tcp.local."]
vars:
  - name: private_dns_host
    label: Private DNS (DoT) hostname
    description: >
      DNS-over-TLS hostname of your sinkhole, e.g. abc123.dns.nextdns.io or
      your AdGuard Home / Pi-hole DoT endpoint. Required by the Private DNS
      actions — leave empty to keep them skipped.
howto: |
  ## Enable ADB on a TCL Google TV

  1. On the TV: **Settings → System → About**
  2. Click **Android TV OS build** 7 times — "You are now a developer!"
  3. **Settings → System → Developer options** → enable **USB debugging**.
     On some firmware port 5555 only opens after pairing once through
     **Wireless debugging** (`adb pair`, `adb connect`, then `adb tcpip 5555`).
  4. Add the TV here at `<ip>:5555` and hit **Connect** — accept the
     *"Allow USB debugging?"* dialog and tick **Always allow from this computer**.

  > ACR: also turn off **Settings → Privacy → Samba Interactive TV / Viewing
  > information services** if your firmware shows it. Disabling `com.tcl.ttvs`
  > stops the client; the menu switch withdraws the consent.

  ### Companion step: delete the advertising ID (once, by hand)

  **Settings → Privacy → Ads → Delete advertising ID**. The GAID lives in Play
  Services and cannot be reset over ADB.
actions:
  # --- TCL tracking & analytics ---
  - id: disable-tcl-ttvs
    name: Disable TCL TTVS (Samba TV ACR + TCL analytics)
    type: package_disable
    package: com.tcl.ttvs
    default: true
    description: >
      Bundles Samba TV automatic content recognition (identifies what is on
      screen, HDMI inputs included), TCL "BI" usage analytics, the Alexa core
      and T-Cast. Alexa and T-Cast stop working with it disabled.

  - id: disable-tcl-logkit
    name: Disable TCL log capture & upload
    type: package_disable
    package: com.tcl.logkit
    default: true
    description: Captures system logs and uploads them to TCL.

  - id: disable-tcl-interactive
    name: Disable TCL TIAS background service
    type: package_disable
    package: com.tcl.interactive
    default: true
    description: TCL interactive-advertising background service.

  # --- TCL content pushes, ads & silent installers ---
  - id: disable-tcl-home-passive
    name: Disable TCL home-screen content push
    type: package_disable
    package: com.tcl.tv.tclhome_passive
    default: true
    description: Pushes TCL content to the Google TV home screen at boot.

  - id: disable-tcl-partnercustomizer
    name: Disable TCL home-row customizer
    type: package_disable
    package: com.tcl.partnercustomizer
    default: true
    description: TCL's tweaks to the Google TV home rows (promoted content).

  - id: disable-tcl-messagebox
    name: Disable TCL push messages
    type: package_disable
    package: com.tcl.messagebox
    default: true
    description: TCL push notifications and promotions.

  - id: disable-tcl-smartlink
    name: Disable TCL SmartLink core (silent installer)
    type: package_disable
    package: com.tcl.smartlink.core
    default: true
    description: Bundles a silent app installer TCL uses to push apps.

  - id: disable-tcl-channelplus
    name: Disable TCL Live FAST channels
    type: package_disable
    package: com.tcl.channelplus
    default: true
    description: TCL's ad-supported live channels (FAST) app and its home row.

  - id: disable-tcl-tv-plus
    name: Disable TCL TV+
    type: package_disable
    package: com.tcl.tv.plus
    default: true
    description: TCL's ad-supported content app.

  # --- Retail demo / hotel mode ---
  - id: disable-tcl-exhibit
    name: Disable store demo mode
    type: package_disable
    package: com.tcl.exhibit
    default: true
    description: Retail showroom demo.

  - id: disable-tcl-esticker
    name: Disable store e-sticker overlay
    type: package_disable
    package: com.tcl.esticker
    default: true
    description: Retail spec-sticker overlay.

  - id: disable-tcl-hotelmenu
    name: Disable hotel mode menu
    type: package_disable
    package: com.tcl.hotelmenu
    default: true
    description: Hospitality (hotel) mode configuration.

  # --- Optional TCL apps ---
  - id: disable-tcl-usercenter
    name: Disable TCL account center
    type: package_disable
    package: com.tcl.usercenter
    default: false
    description: TCL account sign-in and its nags.

  - id: disable-tcl-smartalexa
    name: Disable built-in Alexa
    type: package_disable
    package: com.tcl.smartalexa
    default: false
    description: Amazon Alexa on the TV. Turn on only if you don't use Alexa.

  - id: disable-tcl-browser
    name: Disable TCL web browser
    type: package_disable
    package: com.tcl.browser
    default: false
    description: Preinstalled TCL browser.

  - id: disable-tcl-airplay
    name: Disable AirPlay
    type: package_disable
    package: com.tcl.airplay2
    default: false
    description: >
      TCL's AirPlay receiver. If you disable it, also consider the MediaTek
      helpers com.mediatek.AirplayAPK and com.mediatek.airplaydaemon.

  - id: disable-tcl-manual
    name: Disable e-manual
    type: package_disable
    package: com.tcl.ocean.instructions
    default: false
    description: On-screen instruction manual.

  # --- Google TV (same as the Google TV profile) ---
  # --- Google Privacy Sandbox / Ad Stack ---
  - id: disable-adservices
    name: Disable Google Ad Services (Privacy Sandbox)
    type: package_disable
    package: com.google.android.adservices.api
    default: true
    description: >
      Google's Privacy Sandbox Ad Services API — delivers Topics API, FLEDGE,
      and Attribution Reporting to apps on the device. Disabling stops all
      on-device ad targeting and measurement. IMPORTANT companion step: also
      delete the legacy advertising ID (Settings → Privacy → Ads → Delete
      advertising ID) — otherwise ad SDKs fall back to the GAID, which is a
      MORE invasive persistent cross-app identifier. The GAID lives inside Play
      Services and cannot be reset over ADB, so this is a one-time manual step.
      Small risk: a poorly-written app that hard-requires this API may crash on
      launch — if a specific streaming app breaks, override this action to off
      for that device.

  - id: disable-adservices-ext
    name: Disable Extended Ad Services
    type: package_disable
    package: com.google.android.ext.adservices.api
    default: true
    description: Extended / backwards-compatible Ad Services module.

  - id: disable-federated-compute
    name: Disable Federated Compute (on-device ML for ads)
    type: package_disable
    package: com.google.android.federatedcompute
    default: true
    description: >
      Runs federated learning jobs in the background to improve ad targeting
      models without uploading raw data. Disabling stops these background ML
      training jobs entirely.

  - id: disable-ondevice-personalization
    name: Disable On-Device Personalization
    type: package_disable
    package: com.google.android.ondevicepersonalization.services
    default: true
    description: >
      Builds a persistent personalization profile on the device — used by ad
      networks to serve targeted ads based on local inference. Disabling
      removes this profiling layer.

  # --- Viewing tracking & recommendations ---
  - id: disable-tv-recommendations
    name: Disable TV Recommendations engine
    type: package_disable
    package: com.google.android.tvrecommendations
    default: true
    description: >
      Background service that tracks viewing history to build recommendation
      rows on the home screen and in search. Often pre-disabled on Android 14
      Google TV — included to guarantee the state stays locked.

  # --- Telemetry & remote logging ---
  - id: disable-google-feedback
    name: Disable Google Feedback / usage telemetry
    type: package_disable
    package: com.google.android.feedback
    default: true
    description: Collects crash reports and usage telemetry for Google's analytics pipeline.

  - id: disable-tv-feedback-consent
    name: Disable TV feedback consent UI
    type: package_disable
    package: com.android.tv.feedbackconsent
    default: true
    description: Companion consent UI for the Google TV feedback/telemetry system.

  - id: disable-remote-logging
    name: Disable remote-control usage logging
    type: package_disable
    package: com.google.android.tv.remotecontrol.logging
    default: true
    description: >
      Logs every button press on the remote control and reports usage patterns
      to Google. No functional impact from disabling.

  - id: disable-partner-autoinstall
    name: Disable partner app auto-installer
    type: package_disable
    package: android.autoinstalls.config.google.gtvpai
    default: true
    description: >
      Silently installs the device maker's partner apps after setup and after
      firmware updates (OEM Google TV sets). Apps already installed stay;
      nothing new is pushed. Not present on Google's own Chromecast.

  # --- Optional: content-discovery surfaces (visible home-screen features) ---
  - id: disable-tv-axel
    name: Disable TV Axel (On Now panel)
    type: package_disable
    package: com.google.android.tv.axel
    default: false
    description: >
      The "On Now" panel — an activity-aware home-screen row that surfaces live
      content and recommendations backed by viewing history. NOTE: contrary to
      some online guidance, this has nothing to do with the physical remote;
      remote input is handled by com.google.android.tv.remote.service, which is
      untouched. Disabling removes a visible home-screen row, so it is opt-in:
      set true if you don't use the On Now panel and want the tracking off.

  - id: disable-dreamx
    name: Disable Google TV Dream ambient mode
    type: package_disable
    package: com.google.android.apps.tv.dreamx
    default: false
    description: >
      Ambient screensaver that surfaces featured apps, movies, and promoted
      content when the device is idle. Disabling replaces it with a blank screen.
      Set true if you don't use the screensaver feature.

  - id: disable-backdrop
    name: Disable ambient backdrop screensaver
    type: package_disable
    package: com.google.android.backdrop
    default: false
    description: >
      Backdrop ambient screensaver that shows curated art and Google Photos.
      Mixes in some promoted content. Disabling removes the screensaver entirely.

  # --- Optional: Privacy Sandbox runtime ---
  - id: disable-sdk-sandbox
    name: Disable SDK Runtime (Privacy Sandbox)
    type: package_disable
    package: com.google.android.sdksandbox
    default: false
    description: >
      Isolated runtime for Privacy Sandbox SDKs — lets advertising SDKs run
      in a sandboxed process. Apps generally fall back to legacy ad methods
      rather than crashing when this is disabled.

  # --- Optional: Google Assistant / Voice ---
  - id: disable-katniss
    name: Disable Google TV Assistant / voice search
    type: package_disable
    package: com.google.android.katniss
    default: false
    description: >
      Powers the microphone button and Google Assistant integration on Google TV.
      Disabling removes voice search and "Hey Google" support entirely.
      Only set true if you never use voice control.

  # --- Optional: storefronts ---
  - id: disable-play-games
    name: Disable Google Play Games
    type: package_disable
    package: com.google.android.play.games
    default: false
    description: Preinstalled and phones home. Disable unless you game on this device.

  - id: disable-google-tv-storefront
    name: Disable Google TV storefront (Movies & TV)
    type: package_disable
    package: com.google.android.videos
    default: false
    description: >
      Google TV movie/show purchase and rental storefront. Only disable if you
      never buy or rent through Google TV — removes the app tile entirely.

  # --- Private DNS (DoT) ---
  - id: private-dns-mode
    name: Force Private DNS (DoT)
    type: setting
    namespace: global
    key: private_dns_mode
    value: hostname
    default: false
    requires_vars: [private_dns_host]
    description: >
      Forces every app on the device through your encrypted DNS sinkhole at the
      OS level — defeats hardcoded plain-DNS evasion by any re-enabled package.

  - id: private-dns-host
    name: Private DNS sinkhole hostname
    type: setting
    namespace: global
    key: private_dns_specifier
    value: "{var:private_dns_host}"
    default: false
    requires_vars: [private_dns_host]
    description: Points the OS resolver at your DoT sinkhole (NextDNS, AdGuard Home, ...).
