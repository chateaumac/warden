# Sony Bravia TVs running Android TV / Google TV
id: sony-bravia
name: Sony Bravia (Android TV)
connector: adb
default_port: 5555
description: >
  Sony Bravia TVs on Android TV / Google TV. Disables Google launcher ads and
  recommendation tracking plus Sony's own promotional layer, and can force
  Private DNS (DoT) through your sinkhole.
match:
  keywords: ["sony", "bravia", "xbr-", "kd-", "kdl-"]
vars:
  - name: private_dns_host
    label: Private DNS (DoT) hostname
    description: >
      DNS-over-TLS hostname of your sinkhole, e.g. abc123.dns.nextdns.io.
      Required by the Private DNS actions — leave empty to keep them skipped.
howto: |
  ## Enable ADB debugging (Sony Bravia)

  1. On the TV: **Settings → System → About** (older models:
     **Settings → Device Preferences → About**)
  2. Scroll to **Build** and click it **7 times** — "You are now a developer!"
  3. Open the new **Developer options** menu (under System or Device Preferences)
  4. Enable **USB debugging**, and **Network debugging** if shown.
  5. Add the TV here and hit **Connect** — then accept the
     *"Allow USB debugging?"* dialog on the TV and tick
     **Always allow from this computer**.

  > During initial TV setup Sony also offers **Samba Interactive TV** (ACR
  > viewing tracking). If you accepted it, check Settings → Apps for a Samba
  > entry — the package name varies by region, so add it as a custom shell
  > action or disable it in the TV menu directly.
actions:
  - id: disable-launcher-ads
    name: Disable launcher ads
    type: package_disable
    package: com.google.android.tvlauncher.ads
    default: true
    description: Sponsored rows and banner ads served by the stock Google launcher.
  - id: disable-tv-recommendations
    name: Disable recommendations engine
    type: package_disable
    package: com.google.android.tvrecommendations
    default: true
    description: Background service that tracks viewing to build recommendation rows.
  - id: disable-sony-select
    name: Disable Sony Select
    type: package_disable
    package: com.sony.dtv.sonyselect
    default: true
    description: >
      Sony's own promotional "recommended apps & offers" channel that injects
      content rows into the home screen.
  - id: disable-samba-acr
    name: Disable Samba Interactive TV (ACR)
    type: package_disable
    package: tv.samba.ssm
    default: true
    description: >
      Automatic content recognition — tracks everything shown on screen
      across all HDMI inputs (not just apps) and sells viewing data to
      advertisers. Newer Google TV Bravia models often ship this enabled.
  - id: disable-samba-acr-ui
    name: Disable Samba Interactive TV UI
    type: package_disable
    package: tv.samba.ssm.ui
    default: true
    description: Companion UI/consent package for Samba Interactive TV.
  - id: disable-qterics-analytics
    name: Disable Qterics data analytics
    type: package_disable
    package: com.qterics.da.product
    default: true
    description: Third-party viewing-analytics SDK bundled by Sony on some models.
  - id: disable-sony-da-service
    name: Disable Sony device analytics service
    type: package_disable
    package: com.sony.dtv.da.service
    default: true
    description: Sony's own device-analytics/telemetry service.
  - id: disable-sony-promos
    name: Disable Sony promotional content
    type: package_disable
    package: com.sony.dtv.promos
    default: true
    description: Sony's promotional / sponsored-content package.
  - id: disable-sony-idd-agent
    name: Disable Sony diagnostics & telemetry agent
    type: package_disable
    package: com.sonyericsson.idd.agent
    default: true
    description: Sony's "Information Delivery & Diagnostics" agent - crash and usage telemetry.
  - id: disable-tv-dreamx
    name: Disable Google TV ambient mode (Dream)
    type: package_disable
    package: com.google.android.apps.tv.dreamx
    default: false
    description: >
      Google TV's ambient/screensaver mode, which surfaces promoted content
      and art. Disabling removes the screensaver entirely - opt in.
  - id: disable-sony-usercontext
    name: Disable Sony user-context tracking
    type: package_disable
    package: com.sony.dtv.usercontext
    default: false
    description: >
      Feeds personalization/recommendation rows (e.g. "continue watching").
      Disabling stops behavioral tracking but also removes that feature.
  - id: disable-sony-lastaccess
    name: Disable Sony last-access tracking
    type: package_disable
    package: com.sony.dtv.lastaccess
    default: false
    description: >
      Tracks recently-used apps to populate home-screen rows. Disabling
      stops tracking but also removes the "recent apps" row.
  - id: disable-sonypicturescore
    name: Disable Sony Pictures Core (Bravia Core)
    type: package_disable
    package: com.sonypicturescore
    default: false
    description: Sony's preinstalled movie storefront / streaming app.
  - id: private-dns-mode
    name: Force Private DNS (DoT)
    type: setting
    namespace: global
    key: private_dns_mode
    value: hostname
    default: false
    requires_vars: [private_dns_host]
    description: >
      Forces every app on the TV through your encrypted DNS sinkhole at the OS
      level. Enable together with the sinkhole hostname action below.
  - id: private-dns-host
    name: Private DNS sinkhole hostname
    type: setting
    namespace: global
    key: private_dns_specifier
    value: "{var:private_dns_host}"
    default: false
    requires_vars: [private_dns_host]
    description: Points the OS resolver at your DoT sinkhole.
