services:
  warden:
    build: .
    image: warden:latest
    container_name: warden
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - warden_data:/data
    environment:
      - WARDEN_AUDIT_INTERVAL=900
      - WARDEN_GUARD_INTERVAL=1.5
      - WARDEN_DATA_DIR=/data
    # host networking can be enabled if mDNS discovery across subnets requires it:
    # network_mode: host

volumes:
  warden_data:
    name: warden_data
